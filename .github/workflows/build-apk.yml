name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Generate Official Java Keystore if not present
        run: |
          if [ ! -f app/mindshield.jks ]; then
            keytool -genkeypair -v \
              -keystore app/mindshield.jks \
              -alias mindshield \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mindshield123 \
              -keypass mindshield123 \
              -dname "CN=MindShield, OU=Security, O=MindShield, L=Islamabad, ST=Islamabad, C=PK"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git add app/mindshield.jks
            git commit -m "chore: Commit permanent official Java Keystore"
            git push origin main || true
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Push build log on failure
        if: failure()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B build-log
          git add -f build.log
          git commit -m "Build error log"
          git push -f origin build-log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindShield-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0
          name: "MindShield v4.1.0"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}