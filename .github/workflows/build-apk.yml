name: Build MindShield APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew permissions and line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || {
            echo "### Build Failed Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit 1
          }

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk MindShield.apk

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MindShield-Build-Artifact
          path: |
            MindShield.apk
            build.log
          retention-days: 14

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MindShield v1.0.0"
          files: MindShield.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
