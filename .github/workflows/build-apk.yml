name: Build MindShield APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradlew, BOM and line endings
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # Rewrite settings.gradle completely without BOM
          cat > settings.gradle << 'ENDOFFILE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MindShield"
include ':app'
ENDOFFILE
          # Rewrite root build.gradle completely without BOM
          cat > build.gradle << 'ENDOFFILE2'
plugins {
    id 'com.android.application' version '8.3.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.23' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
ENDOFFILE2
          echo "Files rewritten. First bytes:"
          xxd settings.gradle | head -1
          xxd build.gradle | head -1

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK to root
        run: cp app/build/outputs/apk/debug/app-debug.apk MindShield.apk

      - name: Push APK to release-apk branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B release-apk
          git add -f MindShield.apk
          git commit -m "Automated build of MindShield.apk"
          git push -f origin release-apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MindShield-APK
          path: MindShield.apk
          retention-days: 14

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MindShield v1.0.0"
          files: MindShield.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}